<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Go Anime</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #555555;
      color: #ffffff;
      text-align: center;
    }

    h1 {
      margin-top: 40px;
      font-size: 36px;
    }

    p {
      font-size: 18px;
      margin-bottom: 30px;
    }

    .buttons {
      margin-bottom: 40px;
    }

    .buttons a {
      display: inline-block;
      margin: 10px;
      padding: 12px 25px;
      background-color: #ffffff;
      color: #000000;
      text-decoration: none;
      border-radius: 6px;
      font-weight: bold;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .social-links img {
      width: 45px;
      height: 45px;
      cursor: pointer;
    }

    footer {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

  <h1>حمل تطبيق Go Anime</h1>

  <p>حمل الآن واستمتع بمشاهدة مسلسلات وأفلام الأنمي المترجمة</p>

  <div class="buttons">
    <a href="#" target="_blank">تحميل التطبيق</a>
    <a href="#" target="_blank">تحديث التطبيق</a>
  </div>

  <div class="social-links">
    <a href="https://www.facebook.com/goanimeapp" target="_blank">
      <img src="images/facebook.png" alt="Facebook">
    </a>

    <a href="https://www.instagram.com/goanimeapp" target="_blank">
      <img src="images/instagram.png" alt="Instagram">
    </a>

    <a href="https://t.me/goanimeapp" target="_blank">
      <img src="images/telegram.png" alt="Telegram">
    </a>
  </div>

  <footer>
    © 2026 Go Anime. All rights reserved.
  </footer>

</body>
</html>
